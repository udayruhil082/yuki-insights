name: Daily competitor check

on:
  schedule:
    - cron: "30 2 * * *"      # every day 02:30 UTC = 8:00 AM India time
  issues:
    types: [opened, edited]   # refresh right away when someone logs a post
  workflow_dispatch:          # "Run workflow" button for a manual refresh

permissions:
  contents: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'post-log')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Collect news, videos and logged posts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python radar/collect.py
      - name: Save results
        run: |
          git config user.name "competitor-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
      - name: Post Monday digest (GitHub emails it to you)
        if: github.event_name == 'schedule' && github.event.schedule == '30 2 * * *'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            gh label create digest --color 8e3b6e --force
            gh issue create --title "Weekly competitor digest – $(date -u +'%d %b %Y')" \
              --label digest --body-file docs/data/digest.md
          fi
